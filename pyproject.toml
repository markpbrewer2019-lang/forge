[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "forge-crafting"
version = "0.1.0"
description = "Auditable crafting correctness harness with a synthetic proving ground"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
forge = "forge.cli:main"

[tool.setuptools.packages.find]
include = ["forge*"]
